<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:IS;font-style:normal;src:url(../fontes/InstrumentSerif-regular.woff2)}
@font-face{font-family:IS;font-style:italic;src:url(../fontes/InstrumentSerif-italic.woff2)}
html,body{margin:0;background:transparent}
#box{position:absolute;left:200px;top:440px;width:680px;height:720px;display:flex;align-items:center;justify-content:center}
#t{width:680px;text-align:center;font:400 84px/1.04 IS,serif;color:#fff;text-shadow:0 3px 22px #000c,0 1px 3px #0009;transform-origin:50% 50%}
.n{color:#fff}.g{color:#F5B335;font-style:italic}.r{color:#E5322D}
</style></head><body><div id="box"><div id="t"></div></div>
<script>
window.setText=(html,s,o)=>{const t=document.getElementById('t');t.style.transform='none';t.innerHTML=html;
 const linhas=()=>{const tops=new Set();t.querySelectorAll('span').forEach(x=>{for(const r of x.getClientRects())tops.add(Math.round(r.top/10))});return tops.size;};
 const larg=()=>Math.max(0,...[...t.querySelectorAll('span')].map(x=>Math.max(...[...x.getClientRects()].map(r=>r.width))));
 let size=100;t.style.fontSize=size+'px';
 while(size>48&&(linhas()>2||larg()>670)){size-=4;t.style.fontSize=size+'px';}
 t.style.transform=`scale(${s})`;t.style.opacity=o;};
</script></body></html>
